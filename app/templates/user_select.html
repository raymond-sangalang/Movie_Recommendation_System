{% extends "layout.html" %}
{% block content %}

<div class="page-wrapper">

    <div class="sidebar">
        <h3>User Selection</h3>
        <p>Select a user to view personalized recommendations.</p>
    </div>

    <div class="container" style="text-align:center; max-width:500px;">

        <h2 class="info-text">Choose User</h2>

        <form action="/user_recommend" method="POST">

            <label class="info-text" for="user_id">User ID:</label>

            <select name="user_id" id="user_id" class="input">
                {% for uid in user_ids %}
                <option value="{{ uid }}">{{ uid }}</option>
                {% endfor %}
            </select>

            <button type="submit" class="btn">Get Recommendations</button>
        </form>

    </div>

</div>

{% endblock %}
